<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NovaShop — Asistente Virtual</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    background: #0f1115;
    color: #e8e8e8;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #9aa0aa; margin-top: 0; }
  #chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
    min-height: 200px;
  }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2b5cff; color: white; }
  .bot { align-self: flex-start; background: #1d212b; border: 1px solid #2a2f3a; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #2a2f3a;
    background: #1d212b;
    color: #e8e8e8;
    font-size: 1rem;
  }
  button {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background: #2b5cff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .fuentes { margin-top: 6px; font-size: 0.75rem; color: #8a8f99; }
</style>
</head>
<body>
  <h1>🛍️ NovaShop — Asistente Virtual</h1>
  <p class="subtitle">Preguntame sobre envíos, devoluciones, pagos o políticas de la tienda.</p>

  <div id="chat"></div>

  <form id="form">
    <input id="pregunta" type="text" placeholder="Ej: ¿Cuántos días tengo para devolver un producto?" autocomplete="off" />
    <button id="enviar" type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('pregunta');
    const boton = document.getElementById('enviar');

    function agregarMensaje(texto, clase) {
      const div = document.createElement('div');
      div.className = `msg ${clase}`;
      div.textContent = texto;
      chat.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pregunta = input.value.trim();
      if (!pregunta) return;

      agregarMensaje(pregunta, 'user');
      input.value = '';
      boton.disabled = true;
      const botMsg = agregarMensaje('Pensando...', 'bot');

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pregunta }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error desconocido');
        botMsg.textContent = data.respuesta;
      } catch (err) {
        botMsg.textContent = `Error: ${err.message}`;
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
